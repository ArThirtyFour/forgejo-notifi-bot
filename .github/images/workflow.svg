<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#171d2d" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1000" height="240" rx="16" fill="url(#bg2)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Node 1: Forgejo -->
  <g transform="translate(60, 45)">
    <rect width="220" height="150" rx="12" fill="#1e293b" stroke="#ff5722" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#ff5722" />
    <text x="31" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">F</text>
    <text x="64" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Forgejo / Gitea</text>
    <text x="24" y="80" font-family="sans-serif" font-size="13" fill="#94a3b8">• Codeberg.org</text>
    <text x="24" y="104" font-family="sans-serif" font-size="13" fill="#94a3b8">• Self-hosted Git</text>
    <text x="24" y="128" font-family="sans-serif" font-size="13" fill="#94a3b8">• REST API v1</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 295 120 L 375 120" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="335" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">Polling / Hooks</text>

  <!-- Node 2: Notifier Bot -->
  <g transform="translate(390, 45)">
    <rect width="220" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#38bdf8" />
    <text x="28" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">🤖</text>
    <text x="64" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Notifier Bot</text>
    <text x="24" y="80" font-family="sans-serif" font-size="13" fill="#94a3b8">• Async Poller</text>
    <text x="24" y="104" font-family="sans-serif" font-size="13" fill="#94a3b8">• Event Filter / Diff</text>
    <text x="24" y="128" font-family="sans-serif" font-size="13" fill="#94a3b8">• SQLite State</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 625 120 L 705 120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="665" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#22c55e" font-weight="bold">HTML Alert</text>

  <!-- Node 3: Telegram -->
  <g transform="translate(720, 45)">
    <rect width="220" height="150" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#22c55e" />
    <text x="28" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">✈️</text>
    <text x="64" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Telegram</text>
    <text x="24" y="80" font-family="sans-serif" font-size="13" fill="#94a3b8">• Group / Channel</text>
    <text x="24" y="104" font-family="sans-serif" font-size="13" fill="#94a3b8">• Forum Topics</text>
    <text x="24" y="128" font-family="sans-serif" font-size="13" fill="#94a3b8">• Expandable Quotes</text>
  </g>
</svg>
