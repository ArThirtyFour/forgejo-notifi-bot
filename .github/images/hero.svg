<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="460" rx="20" fill="url(#bg)" />

  <!-- Background decorative elements -->
  <circle cx="1050" cy="90" r="160" fill="#ff5722" fill-opacity="0.08" filter="blur(40px)" />
  <circle cx="150" cy="380" r="140" fill="#38bdf8" fill-opacity="0.08" filter="blur(40px)" />
  
  <!-- Header badge -->
  <g transform="translate(80, 55)">
    <rect width="170" height="32" rx="16" fill="#334155" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#22c55e" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">FORGEJO &amp; GITEA</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Telegram Notifier Bot
  </text>
  <text x="80" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
    Real-time commit, issue, PR &amp; release notifications with zero port-forwarding.
  </text>

  <!-- Features Pills -->
  <g transform="translate(80, 220)">
    <rect x="0" y="0" width="140" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="23" font-family="sans-serif" font-size="14" fill="#f8fafc">⚡ Auto-Polling</text>

    <rect x="150" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="164" y="23" font-family="sans-serif" font-size="14" fill="#f8fafc">🌐 Multi-Instance</text>

    <rect x="325" y="0" width="155" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="339" y="23" font-family="sans-serif" font-size="14" fill="#f8fafc">🧵 Topic Threads</text>
  </g>

  <!-- Telegram Message Card Mockup -->
  <g transform="translate(640, 50)" filter="url(#shadow)">
    <rect width="480" height="360" rx="16" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Telegram Mock Header -->
    <rect width="480" height="48" rx="16" fill="#1e293b" />
    <rect y="32" width="480" height="16" fill="#1e293b" />
    <circle cx="28" cy="24" r="14" fill="#ff5722" />
    <text x="23" y="29" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">F</text>
    <text x="52" y="25" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Forgejo Bot</text>
    <text x="52" y="38" font-family="sans-serif" font-size="11" fill="#64748b">bot</text>

    <!-- Message Bubble -->
    <g transform="translate(24, 68)">
      <rect width="432" height="268" rx="12" fill="#243044" stroke="#3b4d66" stroke-width="1" />
      
      <!-- Text content -->
      <text x="18" y="32" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc">
        📏 On <tspan fill="#38bdf8">KangelPlugins/PluginManager:main</tspan> new commits!
      </text>
      <text x="18" y="54" font-family="sans-serif" font-size="13" fill="#94a3b8">
        1 commit pushed.
      </text>

      <!-- Blockquote / Commit box -->
      <g transform="translate(18, 70)">
        <rect width="396" height="175" rx="8" fill="#192231" stroke="#2d3c52" stroke-width="1" />
        <rect x="0" y="0" width="4" height="175" rx="2" fill="#ff5722" />
        
        <text x="16" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">
          Commit <tspan fill="#38bdf8">#da0ad89</tspan> by <tspan fill="#fb923c">@kangel</tspan>
        </text>
        <text x="16" y="48" font-family="sans-serif" font-size="13" fill="#cbd5e1" font-style="italic">
          Обновить README.md
        </text>

        <text x="16" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">
          🖊 Modified files:
        </text>
        <rect x="16" y="90" width="130" height="24" rx="4" fill="#0f172a" />
        <text x="24" y="106" font-family="monospace" font-size="12" fill="#38bdf8">README.md</text>

        <text x="16" y="136" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">
          ⌨️ Diff:
        </text>
        <text x="16" y="156" font-family="sans-serif" font-size="12" fill="#22c55e" font-weight="bold">➕ 12</text>
        <text x="60" y="156" font-family="sans-serif" font-size="12" fill="#ef4444" font-weight="bold">➖ 3</text>
      </g>
    </g>
  </g>
</svg>
