<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="460" rx="20" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <circle cx="1020" cy="110" r="170" fill="#ff5722" fill-opacity="0.10" filter="blur(50px)" />
  <circle cx="160" cy="360" r="150" fill="#38bdf8" fill-opacity="0.09" filter="blur(50px)" />
  
  <g transform="translate(70, 50)">
    <g>
      <rect width="176" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="16" r="4.5" fill="#22c55e" />
      <text x="32" y="16" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" dominant-baseline="central" letter-spacing="0.5">FORGEJO &amp; GITEA</text>
    </g>

    <text x="0" y="90" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Telegram Notifier Bot
    </text>

    <text x="0" y="130" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Real-time commit, issue, PR &amp; release notifications
    </text>
    <text x="0" y="154" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748b">
      with dual delivery: background polling &amp; webhooks.
    </text>

    <g transform="translate(0, 195)">
      <g>
        <rect x="0" y="0" width="146" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="73" y="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">⚡ Auto-Polling</text>
      </g>

      <g transform="translate(156, 0)">
        <rect x="0" y="0" width="158" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="79" y="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">🌐 Multi-Instance</text>
      </g>

      <g transform="translate(324, 0)">
        <rect x="0" y="0" width="150" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="75" y="18" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">🧵 Topic Threads</text>
      </g>
    </g>

    <g transform="translate(0, 260)">
      <rect width="474" height="60" rx="10" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" dominant-baseline="central">BUILT WITH</text>
      <text x="20" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" dominant-baseline="central">Python 3.10+ • aiogram 3 • FastAPI • Tortoise-ORM</text>
    </g>
  </g>

  <g transform="translate(620, 45)" filter="url(#shadow)">
    <rect width="510" height="370" rx="16" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5" />

    <path d="M 0 16 A 16 16 0 0 1 16 0 L 494 0 A 16 16 0 0 1 510 16 L 510 50 L 0 50 Z" fill="#1e293b" />
    <line x1="0" y1="50" x2="510" y2="50" stroke="#334155" stroke-width="1" />

    <circle cx="32" cy="25" r="15" fill="url(#badge-grad)" />
    <text x="32" y="25" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">F</text>
    
    <text x="56" y="19" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" dominant-baseline="central">Forgejo Bot</text>
    <text x="56" y="33" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" dominant-baseline="central">bot</text>

    <g transform="translate(20, 66)">
      <rect width="470" height="284" rx="12" fill="#243044" stroke="#3b4d66" stroke-width="1" />
      
      <text x="18" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" dominant-baseline="central">
        📏 On <tspan fill="#38bdf8">KangelPlugins/PluginManager:main</tspan> new commits!
      </text>
      <text x="18" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" dominant-baseline="central">
        1 commit pushed.
      </text>

      <g transform="translate(18, 60)">
        <rect width="434" height="204" rx="8" fill="#192231" stroke="#2d3c52" stroke-width="1" />
        <rect x="0" y="0" width="4" height="204" rx="2" fill="#ff5722" />
        
        <text x="16" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" dominant-baseline="central">
          Commit <tspan fill="#38bdf8">#da0ad89</tspan> by <tspan fill="#fb923c">@kangel</tspan>
        </text>
        <text x="16" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1" font-style="italic" dominant-baseline="central">
          Обновить README.md
        </text>

        <text x="16" y="80" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" dominant-baseline="central">
          🖊 Modified files:
        </text>
        
        <g transform="translate(16, 96)">
          <rect width="130" height="26" rx="5" fill="#0f172a" stroke="#263449" stroke-width="1" />
          <text x="12" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#38bdf8" dominant-baseline="central">README.md</text>
        </g>

        <text x="16" y="146" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" dominant-baseline="central">
          ⌨️ Diff:
        </text>
        <g transform="translate(16, 172)">
          <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#22c55e" font-weight="700" dominant-baseline="central">➕ 12</text>
          <text x="60" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ef4444" font-weight="700" dominant-baseline="central">➖ 3</text>
        </g>
      </g>
    </g>
  </g>
</svg>